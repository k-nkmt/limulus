[package]
name = "limulus_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "limulus_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.2", features = ["extension-module"] }
ariadne = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
