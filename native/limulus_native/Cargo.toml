[package]
name = "limulus_native"
version = "0.6.0"
edition = "2021"

[lib]
name = "limulus_native"
crate-type = ["cdylib"]

[features]
default = ["test-python"]
extension-module = ["pyo3/extension-module"]
test-python = ["pyo3/auto-initialize"]

[dependencies]
pyo3 = "0.28.2"
ariadne = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
arrow = { version = "55.2.0", features = ["ffi"] }
